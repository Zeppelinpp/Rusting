[package]
name = "rusting"
version = "0.1.0"
edition = "2024"

[dependencies]
# HTTP 客户端库 (类似 Python 的 requests)
reqwest = { version = "0.12", features = ["json", "stream"] }

# 异步运行时 (类似 Python 的 asyncio)
tokio = { version = "1", features = ["full"] }

# JSON 序列化/反序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# trait 的异步支持
async-trait = "0.1"

# 流处理 (用于 SSE 流式响应)
futures = "0.3"

# 时间处理
chrono = "0.4"

# 获取 CPU 核心数
num_cpus = "1.16"
